[project]
name = "dv-dss-bot"
version = "0.1.0"
description = "DSS ticket triage: a locked-down, read-only Claude drafts an analysis for a data developer"
requires-python = ">=3.11,<3.12"
dependencies = [
	"mcp>=2",
	"slack-bolt>=1.30.0",
]

[dependency-groups]
dev = ["jsonschema>=4", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.ruff.lint]
extend-select = ["I", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
